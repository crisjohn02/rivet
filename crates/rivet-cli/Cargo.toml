[package]
name = "rivet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rivet command-line interface and output formatting"

[[bin]]
name = "rivet"
path = "src/main.rs"

[features]
default = ["lang-php", "lang-typescript"]
lang-php = ["rivet-parser/lang-php"]
lang-typescript = ["rivet-parser/lang-typescript"]

[dependencies]
clap = { workspace = true }
rivet-parser = { path = "../rivet-parser", default-features = false }
