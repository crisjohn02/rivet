[package]
name = "rivet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rivet command-line interface and output formatting"

[[bin]]
name = "rivet"
path = "src/main.rs"

[features]
default = ["lang-php", "lang-typescript"]
lang-php = ["rivet-parser/lang-php", "rivet-languages/lang-php"]
lang-typescript = ["rivet-parser/lang-typescript", "rivet-languages/lang-typescript"]

[dependencies]
clap = { workspace = true }
# Context test globs are gitignore-style path patterns (`tests/**`), so the
# same pinned matcher the traversal uses is reused instead of a second pattern
# language. T26's `context` module only.
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rivet-core = { path = "../rivet-core" }
rivet-index = { path = "../rivet-index" }
rivet-languages = { path = "../rivet-languages", default-features = false }
rivet-parser = { path = "../rivet-parser", default-features = false }
rivet-store = { path = "../rivet-store" }

[dev-dependencies]
# Gold-TOML parsing in the T18 index-uses integration test only.
toml = { workspace = true }
# AF6 force-rebuild test only: tampers with and dumps stored facts directly.
# Same pinned, bundled version rivet-store uses, so no new dependency resolves.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
