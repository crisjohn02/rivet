[package]
name = "rivet-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Declaration resolution, query matching, context ranking and fitting"

[dependencies]
rivet-core = { path = "../rivet-core" }
rivet-store = { path = "../rivet-store" }
# Scope facts are persisted as JSON, so the resolver reads them back without
# reparsing the source file (T18/T19).
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The T44 TypeScript gold harness (tests/typescript_gold.rs) extracts the
# authored fixture with the real adapter and resolves it with this crate.
rivet-languages = { path = "../rivet-languages" }
rivet-parser = { path = "../rivet-parser" }
toml = { workspace = true }
