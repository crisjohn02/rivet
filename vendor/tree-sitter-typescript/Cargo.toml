# Vendored, minimally patched copy of tree-sitter-typescript v0.23.2 (GR1).
# Every change from upstream is listed in RIVET-PATCHES.md. The generated C
# under typescript/src and tsx/src is committed, so building needs only a C
# compiler, never the tree-sitter CLI.
[package]
name = "tree-sitter-typescript"
description = "TypeScript and TSX grammars for tree-sitter (rivet's patched copy of v0.23.2)"
version = "0.23.2-rivet.1"
authors = [
  "Max Brunsfeld <maxbrunsfeld@gmail.com>",
  "Amaan Qureshi <amaanq12@gmail.com>",
]
license = "MIT"
repository = "https://github.com/tree-sitter/tree-sitter-typescript"
edition = "2021"
autoexamples = false
publish = false

build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
# Upstream's smoke tests and doctest, against the runtime rivet pins.
tree-sitter = { workspace = true }
