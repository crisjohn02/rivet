# Gold expectations for the authored TypeScript/TSX fixture,
# tests/fixtures/typescript/authored/ (cases a-z in its README.md).
#
# How it was made. T41 wrote this before any TypeScript extractor existed, so
# nothing here came from rivet. Each entry was chosen by reading the fixture
# against ADDING-A-LANGUAGE's TypeScript column. Its span was then computed
# mechanically from marker text by a throwaway script: a use-like span is the
# identifier between two markers in a unique context string; a
# declaration-like span runs from its first keyword to the first given end
# string after it. `line`, `column`, `text` and `end_text` are derived from
# those bytes. Two checks need no rivet:
# - crates/rivet-languages/tests/typescript_gold.rs parses every fixture file
#   with the pinned tree-sitter-typescript grammar and requires each
#   declaration-like span to be exactly one named node and each use span to be
#   exactly one identifier node;
# - tests/gold/check_gold.py checks the recorded text at every span.
#
# Span conventions, adapted from php-authored.toml:
# - A declaration starts at its first modifier or keyword, including `export`,
#   `export default` and `declare`: for an exported declaration the span is the
#   export statement. It ends where the grammar node ends: after the closing
#   `}` of a body, after the `;` of a statement (a const, a function
#   signature), and before the `;` of a class or interface member, which
#   tree-sitter-typescript leaves outside the member node. Comments are outside.
# - One statement declaring several consts gives each name the statement's span,
#   as PHP multi-name constants do.
# - A constructor parameter property spans its parameter, as a PHP promoted
#   property does.
# - A use covers the identifier only, never its receiver.
# - Bytes are zero-based and half-open; lines and UTF-8 byte columns are
#   one-based (OUTPUT-CONTRACT). `text` is the first 40 bytes of a
#   declaration-like span (fewer at a UTF-8 boundary), `end_text` the last 40.
#
# Naming, where ADDING-A-LANGUAGE says only "lexical nesting with `.`":
# - Members are `Class.member`; a constructor is the method `Class.constructor`;
#   an ES private name keeps its `#`, as PHP properties keep `$`.
# - Fields, parameter properties and interface property signatures are
#   `property`; interface method signatures are `method`; enum members are
#   `const`, as PHP enum cases are; namespaces and module blocks are `module`.
# - A const bound to an arrow or function expression is one `function`.
# - An ambient declaration in a .d.ts file is named exactly as the same
#   declaration in a .ts file; the file path distinguishes modules.
# - Settled by T42 (docs/ADDING-A-LANGUAGE.md): a type alias is a `type_alias`;
#   a generic type parameter, a function-local declaration, a string-named
#   ambient module and its members are not symbols; a getter and a setter are
#   each a `method`, with ordinals when they share a name; overload signatures
#   fold into the implementation in the same scope (or, with none, into the
#   first signature), so only that one is a symbol.
# - `id` is `<path>#<qualified name>` with the fixture root as the repository
#   root, `%` and `#` escaped as `%25`/`%23`, and a one-based `#<n>` ordinal on
#   every duplicate qualified name in a file in (start_byte, end_byte, kind)
#   order (spec 10.1).
#
# Uses:
# - `ref_kind` is `call` for a callee (a member call records the member) and
#   for a capitalized JSX component name; `type` for a type annotation, a
#   heritage clause and a `new` target, as in PHP; `import` for the local
#   binding an import creates, the alias when there is one, as PHP records
#   `use ... as Alias`; `unknown` for any other identifier in code, such as an
#   object before `.`.
# - Settled by T43: the local name in a re-export specifier (`double` in
#   `export { double as twice } from "./util"`) is an `import` use, which
#   stays unresolved because re-exports are not followed; a JSX attribute name
#   and a closing tag's name are not uses; `import type` is an `import` use
#   like any named import.
# - Settled by T44: `import type` binds like any direct import, so T44
#   corrected T41's two `Survey` entries in src/unresolved.ts from unresolved
#   to `exact` (and their case from x to b).
# - `container` is the id of the nearest enclosing function, method, class,
#   interface or enum symbol (the PHP container rule), or "" for none. A module,
#   const or property is not a container; an anonymous function or class is
#   transparent.
# - `receiver` is the receiver's source text without `?.`, or "".
#
# Bindings name a [[use]] span. `expected_target` is an id, or "" when the use
# stays unresolved; `expected_resolution` is the justified tier (spec 11.3,
# 11.4). `not_target`, when present, is an id the use must never resolve to and
# that reference mode for that id must exclude. The harnesses verify only the
# first half for TypeScript: the one `not_target` use, case p's shadowed
# `double(7)`, is bound to a function-local const, which is no symbol, so it
# stays unresolved, and TypeScript has no evidence-based exclusion (spec
# 11.5), so reference mode for src/util.ts#double still lists it as
# `name_match`.
#
# Tables and task tags. Each entry carries the task that makes it verifiable:
# - [[declaration]] T42: a named definition.
# - [[not_a_declaration]] T42: a span that must not become a symbol.
# - [[use]] T43: an identifier use.
# - [[not_a_use]] T43: identifier-like text that is not a use.
# - [[binding]] T44 for lexical bindings: same-file declarations and direct
#   relative imports, and the import forms that must stay unresolved.
#   T45 for receiver hints (`this`, `new`, annotations) and the receivers that
#   must not upgrade.
# - [[undecided]] T42 or T43: a construct the docs do not settle. `question`
#   states it and `proposal` suggests an answer. The tagged task settles each
#   one by moving it to a decided table; check_gold.py fails while a done task
#   still has an undecided entry.
#
# src/broken.ts, src/legacy.js and src/esm.mts have no entries: typescript_gold.rs
# pins their parse outcome and grammar dispatch (and, since T42, that the
# extractor yields no facts and one parse_error for src/broken.ts), and the CLI
# tests pin that indexing the fixture reports src/broken.ts as a parse error
# and the other two as unsupported (T43).

# The tasks whose entries are verified. check_gold.py checks their spans and
# names the harness that compares them with rivet (T42 and T43: the extractor,
# in crates/rivet-languages/tests/typescript_gold.rs; T43 also end to end
# through the CLI, in crates/rivet-cli/tests/typescript_index.rs; T44: the
# extractor and resolver, in crates/rivet-index/tests/typescript_gold.rs, and
# end to end through the CLI, in crates/rivet-cli/tests/typescript_index.rs);
# every other entry is reported as pending, per task. Add a task in the same
# change that makes its entries pass.
done_tasks = ["T42", "T43", "T44"]

# Every occurrence of these names outside comments in a supported fixture file
# is a declaration's name or exactly one [[use]], [[not_a_use]] or [[undecided]]
# span (typescript_gold.rs), so candidate mode can be checked for completeness.
focus_names = ["launch", "double", "SurveyService", "Button"]

