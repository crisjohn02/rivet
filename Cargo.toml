# rivet build workspace.
#
# This is a virtual manifest: it defines the workspace and shared package
# metadata but has no package of its own. See docs/BUILDING.md.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
