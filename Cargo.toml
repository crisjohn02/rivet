# rivet build workspace.
#
# This is a virtual manifest: it defines the workspace and shared package
# metadata but has no package of its own. See docs/BUILDING.md.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Highest rust-version declared by any resolved dependency (currently tree-sitter
# 0.27.0); never higher than the installed toolchain. See docs/TASKS.md checkpoint.
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
# Config parsing in rivet-core only. Pinned to the exact registry versions
# checked with `cargo search`; `serde` needs its derive feature.
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.6"
# Gitignore-aware directory traversal in rivet-core only. Pinned to the exact
# registry version checked with `cargo search`.
ignore = "=0.4.33"
# Content hashing in rivet-core only. Pinned to the exact registry version
# checked with `cargo search`.
blake3 = "=1.8.7"
# Grammars and the core parser are pinned to an exact compatible set: the grammar
# crates expose `tree-sitter-language` 0.1, which tree-sitter 0.27.0 expects.
tree-sitter = "=0.27.0"
tree-sitter-php = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
