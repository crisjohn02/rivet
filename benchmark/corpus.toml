# Benchmark corpus manifest. Read by benchmark/fetch-corpus.sh and by later
# benchmark tasks (T37 onward). Field names are stable; add fields rather than
# renaming them.
#
# Both projects are PRIVATE. This public file deliberately records nothing
# that identifies or describes their contents: no URL, source path, licence
# text, copyright holder, or internal structure. See benchmark/CORPUS.md.

schema_version = 1

# The pilot / held-out partition (docs/BENCHMARK.md "Pilot before the full
# benchmark") exists but is recorded privately, because naming the parts
# would reveal internal structure. It lives in `partition.md` inside the
# private gold directory ($RIVET_PRIVATE_GOLD_DIR), next to the private gold
# samples. Pilot tasks (T38) may draw only on the pilot partition.
partition = "private"
partition_file = "$RIVET_PRIVATE_GOLD_DIR/partition.md"

# How the counts below were produced (not repeated per project):
#   files.*        tracked files at `commit`, by extension, counted from
#                  `git ls-files`. `*_in_excluded_dirs` counts files under a
#                  directory named by a spec §26 default exclusion (for
#                  example a nested `vendor/`); rivet skips those without
#                  counting them as seen.
#   rivet_index.*  `rivet index --timing --json` from the rivet commit named
#                  in `measured_with`, release build, on the copy described
#                  in CORPUS.md. `cold_ms` is the median of 5 runs with the
#                  `.rivet/` directory deleted first; `noop_refresh_ms` is
#                  the median of 3 immediately repeated runs with no change;
#                  `force_ms` is one `--force` run. Machine: Apple Silicon
#                  macOS laptop. Timings are indicative only; T37 owns the
#                  measured protocol.

[[project]]
name = "fluent"
distribution = "private local repository, not redistributable"
license = "proprietary, not published"
commit = "fc96ad75ea658e60df52dbbb8543077b0b931d14"
languages = ["php"]
rationale = "Large private Laravel application with substantial first-party code and many methods sharing a name across classes; never public, so unlikely to be memorized."

